name: Compile and Upload Resume PDF
on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.pdf'

permissions:
  contents: write

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            resume/software-resume.tex
            resume/product-resume.tex
            resume/product-engineer-resume.tex
            cover-letter/software-cover-letter.tex
            cover-letter/product-cover-letter.tex
            cover-letter/product-engineer-cover-letter.tex
          work_in_root_file_dir: true

      - name: Post Processing
        run: |
          mkdir -p build/resume build/cover-letter
          cp resume/*.pdf build/resume/
          cp cover-letter/*.pdf build/cover-letter/
          # legacy paths kept so older links keep working
          cp resume/software-resume.pdf build/resume.pdf
          cp resume/product-resume.pdf build/product-resume.pdf
          cp index.html build/
          cp CNAME build/

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: build
          clean: true
